# Publishes this n8n community node package to npm when a version tag is pushed.
#
# n8n requires community nodes to be published from GitHub Actions with an npm provenance statement.
# Authentication uses npm trusted publishing (OIDC, no long-lived secret). In npm package settings add a
# Trusted Publisher: GitHub Actions, repository kiriminow/n8n-nodes-kirimi, workflow "publish.yml".
# If no trusted publisher is configured yet, set an NPM_TOKEN repository secret as a fallback.
#
# Tags: both "1.5.0" and "v1.5.0" trigger it. The tag (without a leading "v") must equal the
# version in package.json, otherwise the job fails before anything is published.

name: Publish

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token for npm trusted publishing and provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate package structure
        run: node validate.js

      - name: Unit tests
        run: npm test

      - name: Publish with provenance
        # Same as the n8n-nodes-starter: `n8n-node release` publishes with provenance in CI
        # (a plain `npm publish` is blocked by the prepublishOnly `n8n-node prerelease` guard).
        # With trusted publishing, npm exchanges the OIDC token itself; NPM_TOKEN is the fallback.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
